[package]
name        = "torvpn-core"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true

[dependencies]
anyhow      = { workspace = true }
thiserror   = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
toml        = { workspace = true }
tokio       = { workspace = true }
which       = { workspace = true }
dirs        = { workspace = true }
hex         = { workspace = true }
hmac        = { workspace = true }
sha2        = { workspace = true }
rand        = { workspace = true }
humantime   = { workspace = true }
base64      = { workspace = true }
log         = { workspace = true }

# Optional PQC — heavy, off by default. Keeps the lib usable without dragging
# Dilithium/Kyber into every build.
pqcrypto-dilithium = { version = "0.5", optional = true }
pqcrypto-kyber     = { version = "0.8", optional = true }
pqcrypto-traits    = { version = "0.3", optional = true }

[features]
default = []
pqc     = ["pqcrypto-dilithium", "pqcrypto-kyber", "pqcrypto-traits"]

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
