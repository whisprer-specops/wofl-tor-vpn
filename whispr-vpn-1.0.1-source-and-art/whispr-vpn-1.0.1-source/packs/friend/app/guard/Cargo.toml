[package]
name = "whispr-vpn-guard"
version = "0.4.0"
edition = "2024"
license = "MIT"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Rpc"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
